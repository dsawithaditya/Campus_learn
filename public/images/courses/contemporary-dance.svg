<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="c11-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9F7FD"/>
      <stop offset="100%" stop-color="#EFF3FC"/>
    </linearGradient>
    <radialGradient id="c11-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0859D4" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#0859D4" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0859D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="c11-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="rgba(29,29,31,0.045)" stroke-width="1"/>
    </pattern>
    <filter id="c11-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1D1D1F" flood-opacity="0.09"/>
    </filter>
    <filter id="c11-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0859D4" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#c11-bg)"/>
  <rect width="800" height="500" fill="url(#c11-grid)"/>
  <rect width="800" height="500" fill="url(#c11-glow)"/>
    <g filter="url(#c11-shadow)">
      <circle cx="400" cy="250" r="175" fill="#FFFFFF" stroke="rgba(29,29,31,0.07)"/>
    </g>
    <path d="M180 310 C280 120, 420 380, 620 180" stroke="#0859D4" stroke-width="24" stroke-opacity="0.14" stroke-linecap="round"/>
    <path d="M180 310 C280 120, 420 380, 620 180" stroke="#0859D4" stroke-width="4" stroke-linecap="round"/>
    <path d="M200 200 C340 360, 460 120, 600 290" stroke="#A855F7" stroke-width="3.5" stroke-opacity="0.7" stroke-linecap="round"/>
    <circle cx="400" cy="245" r="16" fill="#FFFFFF" stroke="#0859D4" stroke-width="4"/>
  </svg>