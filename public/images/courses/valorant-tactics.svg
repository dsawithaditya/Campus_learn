<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="c22-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7F8FC"/>
      <stop offset="100%" stop-color="#ECEFFA"/>
    </linearGradient>
    <radialGradient id="c22-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#E11D48" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <pattern id="c22-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="rgba(29,29,31,0.045)" stroke-width="1"/>
    </pattern>
    <filter id="c22-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1D1D1F" flood-opacity="0.09"/>
    </filter>
    <filter id="c22-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#E11D48" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#c22-bg)"/>
  <rect width="800" height="500" fill="url(#c22-grid)"/>
  <rect width="800" height="500" fill="url(#c22-glow)"/>
    <g filter="url(#c22-shadow)">
      <circle cx="400" cy="250" r="165" fill="#FFFFFF" stroke="rgba(29,29,31,0.08)"/>
    </g>
    <circle cx="400" cy="250" r="122" stroke="rgba(8,89,212,0.22)" stroke-width="2" stroke-dasharray="8 8"/>
    <circle cx="400" cy="250" r="76" stroke="#0859D4" stroke-width="3"/>
    <circle cx="400" cy="250" r="14" fill="#E11D48"/>
    <g stroke="#1D1D1F" stroke-width="3" stroke-linecap="round">
      <line x1="400" y1="138" x2="400" y2="196"/>
      <line x1="400" y1="304" x2="400" y2="362"/>
      <line x1="288" y1="250" x2="346" y2="250"/>
      <line x1="454" y1="250" x2="512" y2="250"/>
    </g>
    <path d="M295 335 C340 285, 365 268, 400 250" stroke="#0859D4" stroke-width="2.5" stroke-dasharray="5 5"/>
